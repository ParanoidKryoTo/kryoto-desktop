[package]
name = "kryoto-desktop"
version = "0.2.4"
description = "Kryoto's native desktop launcher shell."
authors = ["Kryoto"]
license = "MIT"
edition = "2021"

[lib]
name = "kryoto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6", "gtk3"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["sync", "fs", "io-util", "time"] }
futures-util = "0.3"
sevenz-rust = "0.6"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
regex = "1"
base64 = "0.22"
percent-encoding = "2"
notify-rust = "4"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
